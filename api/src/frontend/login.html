<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | EnvLock</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/auth.js"></script>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">EnvLock</p>
        <h1 id="login-title">Log in</h1>
        <p class="lede">Access your project secrets and environments.</p>

        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>

        <form id="login-form" data-auth-form="login" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Log in</button>
        </form>

        <p class="switch-link">Need an account? <a href="/register">Register</a></p>
      </section>
    </main>
  </body>
</html>
